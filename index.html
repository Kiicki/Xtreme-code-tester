<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src https: http:; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; worker-src 'self'; manifest-src 'self'">
<title>Pulse · Server health check</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elevated: #111111;
    --bg-input: #0a0a0a;
    --bg-hover: #161616;
    --border: #1f1f1f;
    --border-strong: #2a2a2a;
    --text: #ededed;
    --text-muted: #888;
    --text-subtle: #555;
    --accent: #fafafa;
    --accent-fg: #0a0a0a;
    --ok: #10b981;
    --ok-soft: rgba(16, 185, 129, 0.14);
    --auth: #f59e0b;
    --auth-soft: rgba(245, 158, 11, 0.14);
    --fail: #ef4444;
    --fail-soft: rgba(239, 68, 68, 0.14);
    --pending: #525252;
    --shadow: 0 0 0 1px var(--border), 0 8px 24px rgba(0,0,0,0.3);
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Inter", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --pad: clamp(0.875rem, 2.5vw, 1.25rem);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fafafa;
      --bg-elevated: #ffffff;
      --bg-input: #fafafa;
      --bg-hover: #f5f5f5;
      --border: #e8e8e8;
      --border-strong: #d4d4d4;
      --text: #0a0a0a;
      --text-muted: #737373;
      --text-subtle: #a3a3a3;
      --accent: #0a0a0a;
      --accent-fg: #ffffff;
      --ok-soft: rgba(16, 185, 129, 0.12);
      --auth-soft: rgba(245, 158, 11, 0.12);
      --fail-soft: rgba(239, 68, 68, 0.12);
      --shadow: 0 0 0 1px var(--border), 0 4px 12px rgba(0,0,0,0.04);
    }
  }

  * { box-sizing: border-box; }

  html, body { overscroll-behavior-y: none; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: clamp(1rem, 4vw, 4rem) clamp(0.75rem, 3vw, 2rem);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11', 'ss01';
    -webkit-text-size-adjust: 100%;
  }

  .app {
    width: 100%;
    max-width: 680px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: clamp(1rem, 3vw, 1.75rem);
  }

  .brand-mark {
    width: clamp(32px, 8vw, 38px);
    height: clamp(32px, 8vw, 38px);
    border-radius: 9px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    display: grid;
    place-items: center;
    color: white;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
  }
  .brand-mark svg {
    width: 55%; height: 55%;
  }

  .header-text { min-width: 0; flex: 1; }
  .header-text h1 {
    font-size: clamp(15px, 3.5vw, 17px);
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.015em;
  }
  .header-text p {
    font-size: clamp(12px, 3vw, 13px);
    color: var(--text-muted);
    margin: 1px 0 0;
    letter-spacing: -0.005em;
  }

  .card {
    background: var(--bg-elevated);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .input-section { padding: var(--pad); border-bottom: 1px solid var(--border); }

  .label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }

  label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.005em;
  }

  textarea {
    width: 100%;
    min-height: clamp(120px, 30vh, 160px);
    padding: 12px 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    resize: vertical;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--border-strong); }
  textarea::placeholder { color: var(--text-subtle); }

  .credentials {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 8px;
    margin-top: 12px;
  }

  .field {
    min-width: 0;
  }

  .field label {
    display: block;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    min-height: 38px;
    padding: 9px 11px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 7px;
    outline: none;
    transition: border-color 0.15s;
  }

  .field input:focus { border-color: var(--border-strong); }
  .field input::placeholder { color: var(--text-subtle); }

  .input-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 9px;
  }

  .hint {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0;
  }
  .hint kbd {
    display: inline-block;
    padding: 1px 5px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text);
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin: 0 1px;
  }

  .url-count {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 2px 7px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 5px;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }
  .url-count.hidden { opacity: 0; pointer-events: none; }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 14px;
    min-height: 40px;
    border-radius: 7px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: -0.005em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    -webkit-tap-highlight-color: transparent;
  }
  button svg { width: 14px; height: 14px; flex-shrink: 0; }

  button.primary {
    flex: 1 1 auto;
    min-width: 130px;
    background: var(--accent);
    color: var(--accent-fg);
  }
  button.primary:hover:not(:disabled) { opacity: 0.88; }
  button.primary:active:not(:disabled) { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  button.secondary {
    background: transparent;
    color: var(--text-muted);
    border-color: var(--border);
  }
  button.secondary:hover {
    color: var(--text);
    border-color: var(--border-strong);
    background: var(--bg-hover);
  }

  button.icon-only {
    padding: 8px;
    min-height: 32px;
    width: 32px;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  button.icon-only:hover {
    color: var(--text);
    border-color: var(--border-strong);
    background: var(--bg-hover);
  }
  button.icon-only svg { width: 13px; height: 13px; }

  .summary {
    display: none;
    padding: 14px var(--pad);
    border-bottom: 1px solid var(--border);
  }

  .summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .summary-stats {
    display: flex;
    align-items: center;
    gap: clamp(12px, 4vw, 20px);
    flex-wrap: wrap;
    min-width: 0;
  }

  .stat {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .stat .num {
    font-family: var(--font-mono);
    font-size: clamp(15px, 4.5vw, 18px);
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.02em;
    text-transform: none;
  }

  .stat.ok .num { color: var(--ok); }
  .stat.auth .num { color: var(--auth); }
  .stat.fail .num { color: var(--fail); }

  .progress {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    display: flex;
  }
  .progress-ok { background: var(--ok); transition: width 0.25s ease; }
  .progress-auth { background: var(--auth); transition: width 0.25s ease; }
  .progress-fail { background: var(--fail); transition: width 0.25s ease; }

  .results { display: none; }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px var(--pad);
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--bg-hover); }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--pending);
    transition: all 0.2s;
  }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
  .dot.auth { background: var(--auth); box-shadow: 0 0 0 4px var(--auth-soft); }
  .dot.fail { background: var(--fail); box-shadow: 0 0 0 4px var(--fail-soft); }
  .dot.spin { animation: pulse 1.4s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  .row-url {
    flex: 1;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: -0.01em;
  }

  .row-meta {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 7px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
    background: var(--border);
    color: var(--text-muted);
  }
  .tag.ok { color: var(--ok); background: var(--ok-soft); }
  .tag.auth { color: var(--auth); background: var(--auth-soft); }
  .tag.fail { color: var(--fail); background: var(--fail-soft); }

  .row-copy {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    min-height: 0;
    padding: 0;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--text-subtle);
    cursor: pointer;
    opacity: 0.45;
    display: grid;
    place-items: center;
    transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .row:hover .row-copy { opacity: 1; }
  .row-copy:hover, .row-copy:focus-visible {
    color: var(--text);
    border-color: var(--border);
    background: var(--bg);
    opacity: 1;
    outline: none;
  }
  .row-copy:active { transform: scale(0.92); }
  .row-copy.copied {
    color: var(--ok);
    border-color: var(--ok-soft);
    background: var(--ok-soft);
    opacity: 1;
  }
  .row-copy svg { width: 12px; height: 12px; }

  footer {
    margin-top: 1.25rem;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-subtle);
    letter-spacing: 0.01em;
  }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 10px 16px;
    background: var(--text);
    color: var(--bg);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    z-index: 100;
    max-width: calc(100vw - 2rem);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Tablet */
  @media (max-width: 768px) {
    .header { gap: 10px; }
  }

  /* Phone */
  @media (max-width: 480px) {
    .credentials { grid-template-columns: 1fr; }
    .row { gap: 10px; }
    .row-url { font-size: 12.5px; }
    .row-meta { font-size: 11px; gap: 6px; }
    .tag { height: 18px; padding: 0 6px; font-size: 10.5px; }
    button.primary { min-width: 100px; }
    .actions { gap: 6px; }
    .row-copy { width: 24px; height: 24px; opacity: 0.7; }
    .row-copy svg { width: 11px; height: 11px; }
  }

  /* Ultra-small (iPhone SE 1st gen, foldables in cover) */
  @media (max-width: 360px) {
    .row {
      flex-wrap: wrap;
      padding: 10px 12px;
    }
    .row-url {
      flex-basis: calc(100% - 50px);
      order: 1;
      font-size: 12px;
    }
    .row-copy {
      order: 2;
    }
    .row-meta {
      flex-basis: 100%;
      padding-left: 20px;
      margin-top: 4px;
      order: 3;
    }
    .stat { font-size: 10px; }
    button { padding: 9px 11px; font-size: 12.5px; }
  }

  /* Large desktops */
  @media (min-width: 1200px) {
    .app { max-width: 720px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Pulse</h1>
      <p>Server health check · multiple URLs in parallel</p>
    </div>
  </header>

  <div class="card">
    <div class="input-section">
      <div class="label-row">
        <label for="servers">Server URLs / Xtream portals</label>
        <button class="icon-only" onclick="pasteFromClipboard()" title="Paste from clipboard" aria-label="Paste">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
          </svg>
        </button>
      </div>
      <textarea id="servers" placeholder="http://server-1.example.com&#10;http://server-2.example.com&#10;http://server-3.example.com/get.php?username=user&amp;password=pass" spellcheck="false"></textarea>
      <div class="input-meta">
        <p class="hint">One target per line · <kbd>Ctrl</kbd>+<kbd>Enter</kbd></p>
        <span class="url-count hidden" id="urlCount">0 URLs</span>
      </div>
      <div class="credentials">
        <div class="field">
          <label for="xtreamUsername">Xtream username</label>
          <input id="xtreamUsername" type="text" inputmode="text" autocomplete="username" spellcheck="false" placeholder="Username">
        </div>
        <div class="field">
          <label for="xtreamPassword">Xtream password</label>
          <input id="xtreamPassword" type="password" autocomplete="current-password" spellcheck="false" placeholder="Password">
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="testBtn" onclick="testAll()">Check all</button>
        <button class="secondary" onclick="pasteFromClipboard()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
          </svg>
          Paste
        </button>
        <button class="secondary" onclick="clearAll()">Clear</button>
      </div>
    </div>

    <div id="summary" class="summary">
      <div class="summary-row">
        <div class="summary-stats">
          <div class="stat ok"><span class="num" id="okCount">0</span><span>up</span></div>
          <div class="stat auth"><span class="num" id="authCount">0</span><span>auth</span></div>
          <div class="stat fail"><span class="num" id="failCount">0</span><span>down</span></div>
          <div class="stat"><span class="num" id="totalCount">0/0</span><span>done</span></div>
        </div>
        <button class="icon-only" onclick="copyResults()" title="Copy results" aria-label="Copy results">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <div class="progress">
        <div class="progress-ok" id="progressOk" style="width:0%"></div>
        <div class="progress-auth" id="progressAuth" style="width:0%"></div>
        <div class="progress-fail" id="progressFail" style="width:0%"></div>
      </div>
    </div>

    <div id="results" class="results"></div>
  </div>

  <footer>via Cloudflare Workers proxy</footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const PROXY = 'https://iptv-tester-proxy.kulasic-igor.workers.dev';
const STORAGE_KEY = 'iptv-tester:input';
const USERNAME_STORAGE_KEY = 'iptv-tester:xtream-username';

let testSession = 0;
let toastTimer = null;

function shouldUseProxy(url) {
  if (!PROXY) return false;
  try {
    return new URL(url).origin !== location.origin;
  } catch {
    return false;
  }
}

function buildProxyUrl(entry) {
  const proxyUrl = new URL(PROXY);
  proxyUrl.searchParams.set('url', entry.url);
  if (entry.mode === 'xtream') {
    proxyUrl.searchParams.set('mode', 'xtream');
    proxyUrl.searchParams.set('username', entry.username);
    proxyUrl.searchParams.set('password', entry.password);
  }
  return proxyUrl.toString();
}

function buildDirectTargetUrl(entry) {
  if (entry.mode !== 'xtream') return entry.url;
  const base = entry.url.endsWith('/') ? entry.url : `${entry.url}/`;
  const apiUrl = new URL('player_api.php', base);
  apiUrl.searchParams.set('username', entry.username);
  apiUrl.searchParams.set('password', entry.password);
  return apiUrl.toString();
}

function cleanUrl(rawUrl) {
  return rawUrl.replace(/[).,;:]+$/, '').trim();
}

function stripTrailingSlash(url) {
  return url.replace(/\/+$/, '');
}

function xtreamBaseFromUrl(urlObj) {
  const base = new URL(urlObj.toString());
  base.search = '';
  base.hash = '';

  if (/\/(?:get|player_api|xmltv)\.php$/i.test(base.pathname)) {
    const directory = new URL('.', base);
    base.pathname = directory.pathname;
  }

  return stripTrailingSlash(base.toString());
}

function buildEntry(rawUrl, username, password) {
  try {
    const parsed = new URL(cleanUrl(rawUrl));
    parsed.hash = '';

    const hasCredentials = Boolean(username && password);
    const mode = hasCredentials ? 'xtream' : 'http';
    const url = mode === 'xtream'
      ? xtreamBaseFromUrl(parsed)
      : stripTrailingSlash(parsed.toString());

    return {
      url,
      mode,
      username: username || '',
      password: password || '',
      label: mode === 'xtream' ? `${url} [Xtream]` : url,
      key: mode === 'xtream' ? `${mode}:${url}:${username}:${password}` : `${mode}:${url}`,
    };
  } catch {
    return null;
  }
}

function getSharedCredentials() {
  const username = document.getElementById('xtreamUsername').value.trim();
  const password = document.getElementById('xtreamPassword').value.trim();
  return username && password ? { username, password } : { username: '', password: '' };
}

function parseTargetLine(line, defaults = {}) {
  const trimmed = line.trim();
  if (!trimmed) return null;

  const pipeParts = trimmed.split('|').map(part => part.trim());
  if (pipeParts.length >= 3 && /^https?:\/\//i.test(pipeParts[0])) {
    return buildEntry(pipeParts[0], pipeParts[1], pipeParts[2]);
  }

  const match = trimmed.match(/https?:\/\/[^\s|,;<>"']+/i);
  if (!match) return null;

  const rawUrl = cleanUrl(match[0]);
  let username = '';
  let password = '';

  try {
    const parsed = new URL(rawUrl);
    username = parsed.searchParams.get('username') || '';
    password = parsed.searchParams.get('password') || '';
  } catch {}

  if (!username || !password) {
    const rest = trimmed.slice(match.index + match[0].length).trim();
    const tokens = rest.split(/[\s|]+/).filter(Boolean);
    if (tokens.length >= 2) {
      username = tokens[0];
      password = tokens[1];
    }
  }

  const finalUsername = username && password ? username : defaults.username || '';
  const finalPassword = username && password ? password : defaults.password || '';
  return buildEntry(rawUrl, finalUsername, finalPassword);
}

function extractEntries(text, defaults = {}) {
  const entries = [];
  const seen = new Set();

  for (const line of text.split(/\r?\n/)) {
    const entry = parseTargetLine(line, defaults);
    if (!entry || seen.has(entry.key)) continue;
    seen.add(entry.key);
    entries.push(entry);
  }

  return entries;
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function updateUrlCount() {
  const count = extractEntries(document.getElementById('servers').value).length;
  const el = document.getElementById('urlCount');
  el.textContent = count === 1 ? '1 target' : `${count} targets`;
  el.classList.toggle('hidden', count === 0);
}

async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    if (!text) {
      showToast('Clipboard is empty');
      return;
    }
    const ta = document.getElementById('servers');
    ta.value = text;
    ta.dispatchEvent(new Event('input'));
    showToast('Pasted from clipboard');
  } catch (e) {
    document.getElementById('servers').focus();
    showToast('Press Ctrl+V to paste');
  }
}

async function copyResults() {
  const rows = document.querySelectorAll('#results .row');
  if (rows.length === 0) return;
  const lines = [...rows].map(row => {
    const url = row.querySelector('.row-url').textContent.trim();
    const time = row.querySelector('.time').textContent.trim();
    const tag = row.querySelector('.tag').textContent.trim();
    return `${tag.padEnd(8)}  ${time.padEnd(8)}  ${url}`;
  });
  try {
    await navigator.clipboard.writeText(lines.join('\n'));
    showToast(`Copied ${rows.length} results`);
  } catch (e) {
    showToast('Copy failed');
  }
}

function isGoodStatus(status) {
  return status >= 200 && status < 400;
}

function isAuthStatus(status) {
  return status === 401 || status === 403;
}

function portalMessage(status) {
  return ({
    'bad-response': 'Xtream portal did not return valid API data',
    'categories-error': 'Xtream portal login worked, but portal data could not be loaded',
    'http-error': 'Xtream portal returned an HTTP error',
    'inactive': 'Xtream account is not active',
    'invalid-auth': 'Xtream username or password was rejected',
    'missing-credentials': 'Xtream username/password is missing',
    'redirected': 'Xtream portal redirected to another host',
    'unreachable': 'Xtream portal is unreachable',
  })[status] || 'Xtream portal check failed';
}

async function testOne(entry) {
  const usingProxy = shouldUseProxy(entry.url);
  const start = Date.now();
  try {
    const resp = await fetch(usingProxy ? buildProxyUrl(entry) : buildDirectTargetUrl(entry), {
      mode: usingProxy ? 'cors' : 'no-cors',
      signal: AbortSignal.timeout(8000),
    });
    const ms = Date.now() - start;
    if (usingProxy && resp.headers.get('X-Proxy-Status') === 'error') {
      const portalStatus = resp.headers.get('X-Portal-Status');
      return {
        ok: false,
        ms,
        kind: portalStatus === 'unreachable' ? 'timeout' : 'down',
        message: portalStatus ? portalMessage(portalStatus) : 'Proxy could not reach the target',
      };
    }

    const proxyStatus = Number(resp.headers.get('X-Upstream-Status') || resp.status);
    const httpStatus = Number.isFinite(proxyStatus) && proxyStatus > 0 ? proxyStatus : resp.status;

    if (entry.mode === 'xtream') {
      const portalStatus = usingProxy ? resp.headers.get('X-Portal-Status') : null;
      if (portalStatus === 'ok') {
        return { ok: true, ms, httpStatus, message: 'Xtream portal authenticated' };
      }
      if (usingProxy && !portalStatus) {
        return {
          ok: false,
          ms,
          httpStatus,
          kind: 'down',
          message: 'Cloudflare Worker is not updated for Xtream checks',
        };
      }
      const authFailed = portalStatus === 'invalid-auth' || isAuthStatus(resp.status);
      return {
        ok: false,
        ms,
        httpStatus,
        kind: 'down',
        message: portalStatus
          ? portalMessage(portalStatus)
          : authFailed
            ? 'Xtream portal rejected the supplied credentials'
            : 'Xtream portal could not be verified',
      };
    }

    if (usingProxy && isAuthStatus(resp.status)) {
      return {
        ok: false,
        ms,
        httpStatus,
        kind: 'auth',
        message: `Server responded with HTTP ${httpStatus} and requires authentication`,
      };
    }

    if (usingProxy && !isGoodStatus(resp.status)) {
      return { ok: false, ms, httpStatus, kind: 'down', message: `HTTP ${httpStatus}` };
    }

    if (!usingProxy && resp.type !== 'opaque' && isAuthStatus(resp.status)) {
      return {
        ok: false,
        ms,
        httpStatus: resp.status,
        kind: 'auth',
        message: `Server responded with HTTP ${resp.status} and requires authentication`,
      };
    }

    if (!usingProxy && resp.type !== 'opaque' && !isGoodStatus(resp.status)) {
      return { ok: false, ms, httpStatus: resp.status, kind: 'down', message: `HTTP ${resp.status}` };
    }

    return { ok: true, ms, httpStatus: usingProxy ? httpStatus : null };
  } catch (e) {
    const ms = Date.now() - start;
    return { ok: false, ms, kind: e.name === 'TimeoutError' ? 'timeout' : 'down' };
  }
}

function buildRow(entry) {
  const row = document.createElement('div');
  row.className = 'row';

  const dot = document.createElement('div');
  dot.className = 'dot spin';

  const urlEl = document.createElement('div');
  urlEl.className = 'row-url';
  urlEl.textContent = entry.label;
  urlEl.title = entry.label;

  const meta = document.createElement('div');
  meta.className = 'row-meta';

  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = '—';

  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = '···';

  meta.append(time, tag);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'row-copy';
  copyBtn.title = 'Copy URL';
  copyBtn.setAttribute('aria-label', 'Copy URL');
  copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  copyBtn.addEventListener('click', () => copyRowUrl(entry.url, copyBtn));

  row.append(dot, urlEl, meta, copyBtn);
  return row;
}

async function copyRowUrl(url, btn) {
  try {
    await navigator.clipboard.writeText(url);
    btn.classList.add('copied');
    showToast('URL copied');
    setTimeout(() => btn.classList.remove('copied'), 1200);
  } catch {
    showToast('Copy failed');
  }
}

function updateRow(row, result) {
  const dot = row.querySelector('.dot');
  const time = row.querySelector('.time');
  const tag = row.querySelector('.tag');
  if (result.ok) {
    dot.className = 'dot ok';
    time.textContent = `${result.ms}ms`;
    tag.className = 'tag ok';
    tag.textContent = 'UP';
  } else if (result.kind === 'auth') {
    dot.className = 'dot auth';
    time.textContent = result.ms ? `${result.ms}ms` : '';
    tag.className = 'tag auth';
    tag.textContent = 'AUTH';
  } else {
    dot.className = 'dot fail';
    time.textContent = result.ms ? `${result.ms}ms` : '';
    tag.className = 'tag fail';
    tag.textContent = result.kind === 'timeout' ? 'TIMEOUT' : 'DOWN';
  }
  tag.title = [result.message, result.httpStatus ? `HTTP ${result.httpStatus}` : '']
    .filter(Boolean)
    .join(' · ');
}

function setSummary(ok, auth, fail, total) {
  document.getElementById('okCount').textContent = ok;
  document.getElementById('authCount').textContent = auth;
  document.getElementById('failCount').textContent = fail;
  document.getElementById('totalCount').textContent = `${ok + auth + fail}/${total}`;
  document.getElementById('progressOk').style.width = `${(ok / total) * 100}%`;
  document.getElementById('progressAuth').style.width = `${(auth / total) * 100}%`;
  document.getElementById('progressFail').style.width = `${(fail / total) * 100}%`;
}

function sortAndAnimate(container, entries) {
  // Sort: UP before AUTH before DOWN, then by response time ascending.
  const rank = (result) => {
    if (!result) return 3;
    if (result.ok) return 0;
    if (result.kind === 'auth') return 1;
    return 2;
  };
  entries.sort((a, b) => {
    if (!a.result) return 1;
    if (!b.result) return -1;
    const statusDelta = rank(a.result) - rank(b.result);
    if (statusDelta !== 0) return statusDelta;
    return (a.result.ms ?? Infinity) - (b.result.ms ?? Infinity);
  });

  // FLIP animation: capture old positions, reorder DOM, animate from old to new.
  const oldTops = new Map(entries.map(({ el }) => [el, el.getBoundingClientRect().top]));
  entries.forEach(({ el }) => container.appendChild(el));
  entries.forEach(({ el }) => {
    const oldTop = oldTops.get(el);
    const newTop = el.getBoundingClientRect().top;
    const dy = oldTop - newTop;
    if (Math.abs(dy) < 1) return;
    el.animate(
      [{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }],
      { duration: 350, easing: 'cubic-bezier(0.2, 0, 0, 1)' }
    );
  });
}

async function testAll() {
  const text = document.getElementById('servers').value;
  const rawUsername = document.getElementById('xtreamUsername').value.trim();
  const rawPassword = document.getElementById('xtreamPassword').value.trim();
  if ((rawUsername || rawPassword) && !(rawUsername && rawPassword)) {
    showToast('Enter both Xtream username and password');
    return;
  }

  const entries = extractEntries(text, getSharedCredentials());
  if (entries.length === 0) {
    showToast('Paste at least one target');
    return;
  }

  const session = ++testSession;
  const btn = document.getElementById('testBtn');
  const results = document.getElementById('results');
  const summary = document.getElementById('summary');

  btn.disabled = true;
  btn.textContent = 'Checking...';
  results.innerHTML = '';
  results.style.display = 'block';
  summary.style.display = 'block';
  setSummary(0, 0, 0, entries.length);

  const rows = entries.map(entry => {
    const el = buildRow(entry);
    results.appendChild(el);
    return { entry, el, result: null };
  });

  let okCount = 0, authCount = 0, failCount = 0;
  await Promise.all(rows.map(async (rowEntry) => {
    const result = await testOne(rowEntry.entry);
    if (session !== testSession) return;
    rowEntry.result = result;
    updateRow(rowEntry.el, result);
    if (result.ok) okCount++;
    else if (result.kind === 'auth') authCount++;
    else failCount++;
    setSummary(okCount, authCount, failCount, entries.length);
  }));

  if (session !== testSession) return;
  sortAndAnimate(results, rows);
  btn.disabled = false;
  btn.textContent = 'Check all';
}

function clearAll() {
  testSession++;
  const btn = document.getElementById('testBtn');
  btn.disabled = false;
  btn.textContent = 'Check all';
  document.getElementById('servers').value = '';
  document.getElementById('xtreamUsername').value = '';
  document.getElementById('xtreamPassword').value = '';
  try { localStorage.removeItem(USERNAME_STORAGE_KEY); } catch {}
  document.getElementById('servers').dispatchEvent(new Event('input'));
  const results = document.getElementById('results');
  const summary = document.getElementById('summary');
  results.innerHTML = '';
  results.style.display = 'none';
  summary.style.display = 'none';
  document.getElementById('servers').focus();
}

document.getElementById('servers').addEventListener('input', () => {
  try { localStorage.setItem(STORAGE_KEY, document.getElementById('servers').value); } catch {}
  updateUrlCount();
});

document.getElementById('xtreamUsername').addEventListener('input', () => {
  try { localStorage.setItem(USERNAME_STORAGE_KEY, document.getElementById('xtreamUsername').value); } catch {}
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    testAll();
  }
});

(function init() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) document.getElementById('servers').value = saved;
    const savedUsername = localStorage.getItem(USERNAME_STORAGE_KEY);
    if (savedUsername) document.getElementById('xtreamUsername').value = savedUsername;
  } catch {}
  updateUrlCount();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
